name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships with the Android SDK, so we use it directly
      - name: Accept licenses and install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CoverLock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CoverLock-APK
          path: CoverLock.apk

      # Also publish it on the repo's Releases page: open Releases, tap CoverLock.apk, done.
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CoverLock v${{ github.run_number }}
          files: CoverLock.apk
